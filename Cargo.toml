[workspace]
members = ["crates/yeravich-app", "crates/yeravich-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
futures-executor = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
slint = "=1.16.1"
slint-build = "=1.16.1"
thiserror = "2"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
