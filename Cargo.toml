[package]
name = "yeravich"
version = "0.0.1"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["tokio"] }
rust-i18n = "4.2.4"
sys-locale = "0.3"
global-hotkey = "0.9"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["fs"] }
toml = "0.8"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "io-util", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
ksni = "0.3.7"
tokio = { version = "1", features = ["process", "time"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "libc"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "HIServices", "AXUIElement", "AXError", "libc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFDictionary", "CFNumber"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSURL", "NSString"] }

[build-dependencies]
serde_json = "1"
